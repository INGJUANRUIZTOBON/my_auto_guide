<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="MY AUTO GUIDE — Tu Copiloto Inteligente, Telemetría en Vivo y Mantenimiento Predictivo">
  <meta name="theme-color" content="#0A0E1A">

  <!-- OpenGraph Meta Tags -->
  <meta property="og:title" content="MY AUTO GUIDE — Copiloto Inteligente">
  <meta property="og:description" content="Monitoreo, telemetría GPS en tiempo real y mantenimiento vehicular predictivo.">
  <meta property="og:type" content="website">

  <!-- iOS PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MyAutoGuide">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MY AUTO GUIDE — Tu Copiloto Inteligente</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A0E1A;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at 50% 40%, #151F38 0%, #0A0E1A 70%);
      transition: opacity 0.4s ease-out;
    }
    .loader-brand {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00E5FF 0%, #0070F3 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.45);
      animation: pulse 2s infinite ease-in-out;
    }
    .loader-spinner {
      margin-top: 28px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 229, 255, 0.15);
      border-top-color: #00E5FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-title {
      margin-top: 20px;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: #FFFFFF;
      text-transform: uppercase;
    }
    .loader-subtitle {
      margin-top: 6px;
      font-size: 12px;
      color: #00E5FF;
      font-weight: 500;
      letter-spacing: 1px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 25px rgba(0, 229, 255, 0.35); }
      50% { transform: scale(1.06); box-shadow: 0 0 45px rgba(0, 229, 255, 0.65); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="loader-brand">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#0A0E1A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.5 2.8C2.1 11 2 11.5 2 12v4c0 .6.4 1 1 1h2"/>
        <circle cx="7" cy="17" r="2"/>
        <path d="M9 17h6"/>
        <circle cx="17" cy="17" r="2"/>
      </svg>
    </div>
    <div class="loader-title">MY AUTO GUIDE</div>
    <div class="loader-subtitle">Iniciando Copiloto Inteligente...</div>
    <div class="loader-spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
