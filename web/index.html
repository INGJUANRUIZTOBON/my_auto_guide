<!DOCTYPE html>
<html lang="es">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="My Auto Guide — Tu Copiloto Inteligente, Telemetría en Vivo y Mantenimiento Predictivo">
  <meta name="theme-color" content="#06080C">

  <!-- OpenGraph Meta Tags -->
  <meta property="og:title" content="My Auto Guide">
  <meta property="og:description" content="Monitoreo, telemetría GPS en tiempo real y copiloto vehicular inteligente.">
  <meta property="og:type" content="website">

  <!-- iOS PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Auto Guide">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon transparente oficial -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png"/>

  <title>My Auto Guide</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #06080C;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Outfit", sans-serif;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #000000;
      overflow: hidden;
      z-index: 99999;
      transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .video-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 854px;
    }

    .intro-video-bg {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000000;
      pointer-events: none;
    }

    .video-overlay-footer {
      position: absolute;
      bottom: 24px;
      left: 0;
      right: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .sync-status {
      margin-top: 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.5px;
      color: rgba(0, 229, 255, 0.85);
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
    }

    .progress-bar-container {
      width: 160px;
      height: 3px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar-fill {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #00E5FF, #7C3AED, #00E5FF);
      background-size: 200% 100%;
      border-radius: 3px;
      animation: progressSweep 1.8s ease-in-out infinite;
    }

    @keyframes progressSweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <div class="video-stage">
      <video id="introVideo" class="intro-video-bg" src="intro_video.mp4" autoplay muted playsinline loop></video>
      <div class="video-overlay-footer">
        <div class="progress-bar-container">
          <div class="progress-bar-fill"></div>
        </div>
        <div class="sync-status">INICIANDO ECOSISTEMA...</div>
      </div>
    </div>
  </div>

  <script>
    // Transición suave hacia Flutter cuando el primer frame esté listo
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function () {
          loader.remove();
        }, 500);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
